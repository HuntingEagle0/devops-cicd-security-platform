# SonarQube Configuration
# Project: devops-cicd-security-platform

sonar.projectKey=devops-cicd-security-platform
sonar.projectName=DevOps CI/CD Security Platform
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=configs,policies,.github
sonar.tests=tests

# File inclusions
sonar.inclusions=**/*.yaml,**/*.yml,**/*.sh,**/*.conf,**/*.rego,**/*.js,**/*.py

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Analysis parameters
sonar.analysis.mode=publish

# Exclusions
sonar.exclusions=**/node_modules/**,**/backup/**,**/artifacts/**,**/*.tar.gz

# Coverage (if applicable)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Issue severity thresholds
sonar.issue.severity.threshold=MAJOR
