apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform-production
  namespace: production
  labels:
    app: devops-platform
    environment: production
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-platform
        version: "1.0.0"
    spec:
      containers:
        - name: devops-app
          image: devops-platform:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-platform-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: devops-platform
